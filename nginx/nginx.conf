# ---------------------------------------------------------------------------
# Slipstream — nginx main configuration.
#
# Mounted at /etc/nginx/nginx.conf. Server blocks come from
# nginx/templates/*.conf.template, which nginx:alpine renders through envsubst
# into /etc/nginx/conf.d/ at container start.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time and $request_time make it possible to tell a slow
    # extraction from a slow proxy. $http_x_forwarded_for is logged so a real
    # client IP is visible when another proxy sits in front of this one.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # --- Transfer behaviour ------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;

    # Do not advertise the exact nginx version. The app sets --no-server-header
    # for the same reason.
    server_tokens      off;

    # --- Sizes and timeouts ------------------------------------------------
    # A pasted URL is tiny; nothing legitimate posts a large body to this app,
    # so the request limit stays small. Downloads are *responses*, which
    # client_max_body_size does not govern.
    client_max_body_size      1m;
    client_body_buffer_size   16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          300s;

    # --- Rate-limit zones --------------------------------------------------
    # Defined here so every server block shares one counter per client.
    # Analysis spawns a yt-dlp process, so it is the expensive endpoint;
    # authentication is limited separately to slow credential stuffing. The
    # app enforces its own per-role hourly limits as well — this layer only
    # stops a flood from reaching Python at all.
    limit_req_zone  $binary_remote_addr  zone=slipstream_api:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=slipstream_auth:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=slipstream_static:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr  zone=slipstream_conn:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # --- Compression -------------------------------------------------------
    # Media responses are already compressed; re-compressing them wastes CPU
    # for no gain, so the type list covers text assets only.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- Upstream ----------------------------------------------------------
    # The upstream lives in the template, not here: only files under
    # /etc/nginx/templates pass through envsubst, so a ${SLIPSTREAM_UPSTREAM}
    # placeholder in this file would reach nginx unexpanded and fail to parse.

    # Rendered from nginx/templates/ by the image's envsubst entrypoint.
    include /etc/nginx/conf.d/*.conf;
}
