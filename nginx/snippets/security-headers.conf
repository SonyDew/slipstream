# ---------------------------------------------------------------------------
# Security headers, included by every server block.
#
# `always` matters: without it these are dropped on error responses, which is
# exactly where a reflected-content problem would show up.
# ---------------------------------------------------------------------------

# Slipstream is same-origin by design, so the CSP can be strict. Notes on the
# parts that are not just 'self':
#   img-src   data: for inline SVG icons, https: because thumbnails are hotlinked
#             from the source platform's CDN rather than proxied.
#   style-src 'unsafe-inline' is required by the inline style attribute Vite and
#             the progress bar use for computed widths.
#   connect-src 'self' only — the SPA talks to nothing but its own /api.
#   frame-ancestors 'none' plus X-Frame-Options: the app is never framed, which
#             removes clickjacking against the admin panel's destructive actions.
#
# upgrade-insecure-requests is deliberately absent. It would break the
# plain-HTTP LAN deployment (templates-http), where the browser would rewrite
# every /assets/ request to https:// against a server with no certificate. On
# the TLS deployment HSTS already forces the upgrade, so it would add nothing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

# No feature the app uses needs any of these, and a downloader has no business
# asking for a camera.
add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# HSTS is set only on the TLS server block (see the template): sending it over
# plain HTTP is meaningless, and a preload-eligible max-age committed by
# accident is painful to undo.
