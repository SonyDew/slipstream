# ---------------------------------------------------------------------------
# Shared proxy settings for the uvicorn upstream.
# ---------------------------------------------------------------------------

proxy_http_version 1.1;

# Host must be the original so the app builds correct absolute URLs.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Empty Connection header lets the upstream keepalive pool work; the default
# "close" would tear down every pooled connection.
proxy_set_header Connection        "";

# Cookies pass through untouched. Rewriting the path or domain here would break
# the session and CSRF pair, which are already scoped correctly by the app.
proxy_pass_header Set-Cookie;

proxy_connect_timeout 10s;
proxy_send_timeout    300s;

# Long enough for a slow extraction on a cold cache, short enough that a wedged
# request eventually clears. The app's own ANALYZE_TIMEOUT and JOB_TIMEOUT are
# the real limits; this is the outer bound.
proxy_read_timeout    300s;

proxy_buffering        on;
proxy_buffer_size      8k;
proxy_buffers          16 8k;
proxy_busy_buffers_size 32k;

# Do not retry a request that already reached the app: analysis and job
# submission are not idempotent, and a silent retry would create duplicate jobs.
proxy_next_upstream error timeout;

# The app never sends these; if a future version does, nginx's own values win
# rather than being duplicated.
proxy_hide_header X-Powered-By;
