# ---------------------------------------------------------------------------
# Release — triggered by a version tag. Verifies the tag matches the declared
# version, extracts the matching CHANGELOG section, attaches the built frontend,
# and creates the GitHub release.
#
# The container image is published by docker.yml, which triggers on the same tag.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version
        id: resolve
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version (tag $tag)"

      - name: Check the tag matches pyproject.toml
        # A tag that disagrees with the packaged version produces an image
        # reporting one number and a release page claiming another, which is
        # impossible to debug from a bug report six months later.
        run: |
          set -e
          version='${{ steps.resolve.outputs.version }}'
          declared=$(grep -m1 '^version' backend/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag: $version   pyproject.toml: $declared"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $version does not match pyproject.toml $declared"
            exit 1
          fi

      - name: Check CHANGELOG.md has a section for this version
        run: |
          set -e
          version='${{ steps.resolve.outputs.version }}'
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
          echo "OK: changelog section present"

  build:
    name: Build the frontend bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Package
        # Operators who deploy from source without Node — the Windows and bare
        # systemd paths both allow this — can drop this archive in as
        # frontend/dist and skip the toolchain entirely.
        run: |
          set -e
          version='${{ needs.verify.outputs.version }}'
          tar -czf "slipstream-frontend-${version}.tar.gz" -C frontend dist
          sha256sum "slipstream-frontend-${version}.tar.gz" \
            > "slipstream-frontend-${version}.tar.gz.sha256"
          ls -la slipstream-frontend-*

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: slipstream-frontend-*
          retention-days: 7

  release:
    name: Create the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      - name: Extract the changelog section
        # Everything between this version's heading and the next '## ' heading.
        # Driven off CHANGELOG.md rather than commit messages so the release
        # notes say what changed for an operator, not what changed in the tree.
        #
        # index() rather than a regex: the heading contains '[' and ']', and awk
        # applies its own escape processing to a dynamic regex string before the
        # regex engine sees it, so '\\[' arrives as a bare '[' and the character
        # class never matches. Also stops at the trailing link-reference block.
        run: |
          set -e
          version='${{ needs.verify.outputs.version }}'
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside && /^\[[^]]+\]: / { exit }
            inside { print }
          ' CHANGELOG.md > notes-body.md

          if [ ! -s notes-body.md ]; then
            echo "::error::extracted no notes for $version — check the CHANGELOG heading"
            exit 1
          fi

          {
            echo "## Slipstream ${version}"
            echo
            cat notes-body.md
            echo
            echo '## Container image'
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository }}:${version}"
            echo '```'
            echo
            echo 'Published for linux/amd64 and linux/arm64.'
            echo
            echo '## Upgrading'
            echo
            echo 'Docker: `./docker/update.sh` (takes a backup first).'
            echo 'Bare systemd: `sudo ./scripts/linux/install.sh` over the existing install.'
            echo 'Windows: `.\scripts\windows\update.ps1`.'
            echo
            echo 'Read `SECURITY.md` before exposing an instance publicly.'
          } > release-notes.md

          echo '--- notes ---'
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          version='${{ needs.verify.outputs.version }}'

          # 0.x is pre-1.0: marked as a pre-release so nobody reads it as a
          # stability promise the project has not made yet.
          prerelease=''
          case "$version" in
            0.*) prerelease='--prerelease' ;;
          esac

          gh release create "$tag" \
            --title "Slipstream $version" \
            --notes-file release-notes.md \
            $prerelease \
            assets/*
