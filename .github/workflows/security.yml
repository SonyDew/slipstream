# ---------------------------------------------------------------------------
# Security — dependency auditing, static analysis, and secret scanning.
#
# This runs on a schedule as well as on push, because a dependency becomes
# vulnerable while the code sits untouched. A weekly run is what turns a CVE
# published after the last commit into something an operator finds out about.
# ---------------------------------------------------------------------------
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:17 UTC. Off the hour to avoid the top-of-hour scheduling
    # backlog on GitHub's shared runners, which delays cron jobs by 10+ minutes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  python-deps:
    name: Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit==2.7.3

      - name: Audit pinned runtime dependencies
        # Audits the requirements file rather than an installed environment so
        # the result reflects what a deployment actually gets. Advisory-only:
        # yt-dlp moves fast enough that a hard gate here would block unrelated
        # work, and the operator-facing fix is usually "update yt-dlp", which is
        # already a documented monthly task.
        continue-on-error: true
        run: |
          pip-audit \
            --requirement backend/requirements.txt \
            --desc \
            --format columns \
            | tee pip-audit.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '### pip-audit'
            echo
            echo '```'
            cat pip-audit.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit
          path: pip-audit.txt
          if-no-files-found: ignore

  node-deps:
    name: Node dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Audit production dependencies
        # --omit=dev because a vulnerability in vite or eslint does not reach a
        # user: the build output is static files and the dev server never runs
        # in production. Dev advisories are reported separately, unblocking.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=critical

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tree. Shallow
          # clones make it report a clean repo even when a key was committed and
          # then removed in a later commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check .env.example carries names only
        # The handoff records this as a hard rule: the example file documents
        # variable names, and a real value pasted into it would be committed and
        # then copied into production by everyone who follows the quick start.
        run: |
          set -e
          bad=$(grep -vE '^\s*(#|$)' .env.example | grep -E '=\s*\S' || true)
          if [ -n "$bad" ]; then
            echo "::error::.env.example contains assigned values:"
            echo "$bad"
            exit 1
          fi
          echo "OK: .env.example is names-only"

      - name: Check the development admin fallback did not leak into deployment
        # The development-only default lives in config.py, init_db.py and the
        # tests that assert it is hashed rather than stored. It must never appear
        # on a deployment surface — an example file, a compose file, a deploy
        # script or a doc — where someone would copy it into production.
        run: |
          set -e
          hits=$(grep -rIln 'oleg2017A' \
                   .env.example docker-compose*.yml Dockerfile \
                   docker/ scripts/ deploy/ nginx/ docs/ \
                   README.md README_WINDOWS.txt 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::the development admin password appears on a deployment surface:"
            echo "$hits"
            exit 1
          fi
          echo "OK: the development fallback is confined to backend code and tests"


  image:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: slipstream:scan
          cache-from: type=gha,scope=linux/amd64

      - name: Trivy — OS packages and language dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: slipstream:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # The Debian base and ffmpeg's dependency tree carry unfixed CVEs at
          # any given moment. Reporting them as findings is useful; failing the
          # build on something with no upstream patch is not actionable.
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
