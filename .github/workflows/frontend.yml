# ---------------------------------------------------------------------------
# Frontend CI — typecheck, lint, build, and a check that the bundle stays split.
# ---------------------------------------------------------------------------
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor in package.json engines; 22 is current LTS.
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` requires a lockfile and installs exactly what it pins, which
        # is what CI should test. Falls back only if the lockfile is absent.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npm run typecheck

      - name: Lint
        # The script passes --max-warnings 0, so a warning fails the job. That
        # is deliberate: warnings that never fail accumulate until they are
        # meaningless.
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check the build output
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/assets     || { echo "dist/assets missing"; exit 1; }
          echo "--- bundle ---"
          ls -la dist/assets/

      - name: Check recharts stayed out of the initial payload
        # The dashboard's charts are lazy-loaded, and recharts plus d3 is by far
        # the largest dependency. If a static import creeps in, it lands in the
        # entry chunk and every visitor downloads it to view the home page.
        run: |
          set -e
          entry=$(ls dist/assets/index-*.js)
          echo "entry chunk: $entry ($(wc -c < "$entry") bytes)"
          if grep -q 'recharts' "$entry"; then
            echo "FAIL: recharts is bundled into the entry chunk."
            echo "Something imports it statically; it must stay behind a lazy() boundary."
            exit 1
          fi
          test -n "$(ls dist/assets/charts-*.js 2>/dev/null)" \
            || { echo "FAIL: no separate charts chunk was emitted"; exit 1; }
          echo "OK: charts are in their own chunk"

      - name: Upload the bundle
        # Only from one matrix leg; two identical artifacts would just collide.
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
